name: 'Linting'
on:
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: 'Yamllint'
        run: |
          yamllint .
      - name: 'Bash lint'
        run: shellcheck scripts/*
