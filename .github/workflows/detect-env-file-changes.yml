name: Detect env file changes

on:
  workflow_call:
    inputs:
      iac:
        description: The path to the parameter stack of the service in the infra repo
        type: string
        default: 'ECS'
        required: false

jobs:
  detect-env-file-changes:
    name: Detect env file changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write
      contents: read

    steps:
      # Reads the file list of the pull request from the API, so no checkout or git history is needed. The API lists
      # at most 3000 files. Outside a pull request there is nothing to comment on, so the check is skipped.
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Added, modified, renamed and deleted files, and the old path of a renamed file.
          files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, .previous_filename // empty')
          env_files=$(grep -E '\.env$' <<< "$files" || true)
          if [ -n "$env_files" ]; then
            echo "Changed env files:"
            echo "$env_files"
            echo 'any_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No env files changed'
            echo 'any_changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if .env files are changed
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          message: |
            ⚠️ **env files changed** ⚠️

            One or more `.env` files have been modified in this PR.
            Please make sure to do the same modifications in ${{ inputs.iac }}
