name: Detect env file changes

on:
  workflow_call:
    inputs:
      iac:
        description: The path to the parameter stack of the service in the infra repo
        type: string
        default: 'ECS'
        required: false

jobs:
  detect-env-file-changes:
    name: Detect env file changes
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Get changed files
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          files: '**/*.env'

      - name: Comment on PR if .env files are changed
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          message: |
            ⚠️ **env files changed** ⚠️

            One or more `.env` files have been modified in this PR.
            Please make sure to do the same modifications in ${{ inputs.iac }}
